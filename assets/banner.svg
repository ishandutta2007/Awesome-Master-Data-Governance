<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 240"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#311042"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulseNode{0%{r:6px;opacity:.4}50%{r:10px;opacity:.9}}@keyframes dashFlow{0%{stroke-dashoffset:40}}@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.5}50%{transform:translateY(-12px) scale(1.2);opacity:.9}}.node-pulse-1{animation:pulseNode 3s infinite ease-in-out}.node-pulse-2{animation:pulseNode 4s infinite ease-in-out 1s}.line-flow{stroke-dasharray:8 6;animation:dashFlow 2.5s linear infinite}.floating-bg{animation:floatParticle 5s infinite ease-in-out}</style></defs><rect width="900" height="240" fill="url(#bgGrad)" rx="16"/><g opacity=".35"><line x1="100" x2="220" y1="60" y2="140" stroke="#818cf8" stroke-width="1.5" class="line-flow"/><line x1="220" x2="350" y1="140" y2="70" stroke="#38bdf8" stroke-width="1.5"/><line x1="700" x2="800" y1="50" y2="130" stroke="#c084fc" stroke-width="1.5" class="line-flow"/><line x1="800" x2="720" y1="130" y2="190" stroke="#818cf8" stroke-width="1.5"/><line x1="120" x2="220" y1="180" y2="140" stroke="#c084fc" stroke-width="1.5"/><circle cx="100" cy="60" r="7" fill="#38bdf8" class="node-pulse-1"/><circle cx="220" cy="140" r="9" fill="#818cf8" class="node-pulse-2"/><circle cx="350" cy="70" r="6" fill="#c084fc" class="node-pulse-1"/><circle cx="700" cy="50" r="8" fill="#38bdf8" class="node-pulse-2"/><circle cx="800" cy="130" r