<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Accent Gradient for Text & Shapes -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.4; }
        50% { r: 10px; opacity: 0.9; }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.5; }
        50% { transform: translateY(-12px) scale(1.2); opacity: 0.9; }
      }
      .node-pulse-1 { animation: pulseNode 3s infinite ease-in-out; }
      .node-pulse-2 { animation: pulseNode 4s infinite ease-in-out 1s; }
      .line-flow { stroke-dasharray: 8 6; animation: dashFlow 2.5s linear infinite; }
      .floating-bg { animation: floatParticle 5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="900" height="240" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Network Graph (Underlay) -->
  <g opacity="0.35">
    <!-- Connecting Lines -->
    <line x1="100" y1="60" x2="220" y2="140" stroke="#818cf8" stroke-width="1.5" class="line-flow" />
    <line x1="220" y1="140" x2="350" y2="70" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="700" y1="50" x2="800" y2="130" stroke="#c084fc" stroke-width="1.5" class="line-flow" />
    <line x1="800" y1="130" x2="720" y2="190" stroke="#818cf8" stroke-width="1.5" />
    <line x1="120" y1="180" x2="220" y2="140" stroke="#c084fc" stroke-width="1.5" />

    <!-- Nodes -->
    <circle cx="100" cy="60" r="7" fill="#38bdf8" class="node-pulse-1" />
    <circle cx="220" cy="140" r="9" fill="#818cf8" class="node-pulse-2" />
    <circle cx="350" cy="70" r="6" fill="#c084fc" class="node-pulse-1" />
    <circle cx="700" cy="50" r="8" fill="#38bdf8" class="node-pulse-2" />
    <circle cx="800" cy="130" r="10" fill="#c084fc" class="node-pulse-1" />
    <circle cx="720" cy="190" r="7" fill="#818cf8" class="node-pulse-2" />
    <circle cx="120" cy="180" r="6" fill="#38bdf8" class="node-pulse-1" />

    <!-- Floating Orbs -->
    <circle cx="450" cy="40" r="25" fill="#818cf8" opacity="0.15" class="floating-bg" />
    <circle cx="600" cy="200" r="35" fill="#c084fc" opacity="0.15" class="floating-bg" />
  </g>

  <!-- Decorative Frame / Accent Border -->
  <rect x="8" y="8" width="884" height="224" rx="12" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Foreground Content Layer (Text & Main Title) -->
  <g text-anchor="middle">
    <!-- Category Badge -->
    <rect x="330" y="28" width="240" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="450" y="45" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">ENTERPRISE DATA ARCHITECTURE</text>

    <!-- Main Title -->
    <text x="450" y="105" fill="url(#accentGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5" filter="url(#glow)">Awesome Master Data Governance</text>
    
    <!-- Subtitle -->
    <text x="450" y="145" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500">
      Golden Records ∙ Multi-Domain MDM ∙ Data Quality ∙ PIM &amp; Governance Ecosystem
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 168)">
      <!-- Pill 1 -->
      <rect x="200" y="0" width="140" height="26" rx="6" fill="none" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
      <text x="270" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏢 SaaS Leaders</text>

      <!-- Pill 2 -->
      <rect x="380" y="0" width="140" height="26" rx="6" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.8"/>
      <text x="450" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open-Source Stack</text>

      <!-- Pill 3 -->
      <rect x="560" y="0" width="140" height="26" rx="6" fill="none" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
      <text x="630" y="17" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Data Quality</text>
    </g>
  </g>
</svg>
